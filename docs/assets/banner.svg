  <text x="600" y="158" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="64" font-weight="700" fill="#f5f3ff">思绪 · guanjia</text>
