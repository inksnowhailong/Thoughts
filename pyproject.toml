[project]
name = "guanjia"
version = "0.1.0"
description = "Home voice butler: always-on listening, barge-in, OpenClaw as the brain"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sherpa-onnx>=1.13",
  "pyaec>=1.0",
  "pyaudiowpatch>=0.2",
  "sounddevice>=0.5",
  "numpy>=2.0",
  "httpx>=0.28",
  "pycaw>=20260927",
  "onnxruntime>=1.30.0",
  "pystray>=0.19.5",
  "pypinyin>=0.55.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guanjia"]
