<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思绪 / 运行控制台</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#101114;--line:rgba(255,255,255,.19);--faint:rgba(255,255,255,.08);--text:#f4f4f4;--dim:#85888d;--red:#ff4d4d;--gold:#d9b45b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:11px/1.45 "Segoe UI",sans-serif;letter-spacing:.025em}
button,input,select{font:inherit;color:inherit;background:#0b0c0e;border:1px solid var(--line);border-radius:2px;padding:5px 7px}
button{cursor:pointer}button:hover,button:focus-visible{border-color:#fff;outline:none}
button:disabled{opacity:.35;cursor:not-allowed}
header{height:48px;display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:#0b0c0e}
.brand{font-size:12px;letter-spacing:.16em;font-weight:600}.sub{color:var(--dim);letter-spacing:.12em}
.status{display:flex;align-items:center;gap:7px;color:var(--dim)}.lamp{width:6px;height:6px;border:1px solid currentColor;border-radius:50%}.lamp.on{background:#fff;box-shadow:0 0 8px #fff}
.grow{flex:1}
nav{display:flex;gap:4px}nav button{border:0;background:transparent;color:var(--dim);letter-spacing:.12em;padding:8px 10px}
nav button.selected{color:#fff;border-bottom:1px solid #fff}
main{height:calc(100vh - 48px);min-height:540px;display:grid;grid-template-columns:220px minmax(360px,1fr) 320px;grid-template-rows:minmax(0,1fr) 185px;gap:1px;background:var(--line)}
aside,.center,.timeline{background:var(--bg);min-width:0;min-height:0}
aside{padding:12px;overflow:auto}.center{position:relative;display:flex;flex-direction:column;overflow:hidden}
.panel-title{font-size:9px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px}.muted{color:var(--dim)}.mono,pre,.id{font-family:Consolas,"Cascadia Mono",monospace}
.trace-list,.memory-list,.event-list{display:flex;flex-direction:column;gap:2px}
.entry{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--faint);padding:8px 4px}
.entry.selected{border-left:1px solid #fff;padding-left:8px;background:rgba(255,255,255,.04)}
.entry strong{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry small{color:var(--dim);display:block;margin-top:3px}
.event-list{margin-top:16px}.event{border-left:1px solid var(--line);padding:3px 6px;color:var(--dim);overflow-wrap:anywhere}
.event.failed{border-color:var(--red);color:#e4a4a4}
.center-head{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border-bottom:1px solid var(--faint)}
.center-head strong{font-size:9px;letter-spacing:.16em}.center-head span{color:var(--dim)}
#topology{display:block;width:100%;height:100%;min-height:280px}
.edge{stroke:rgba(255,255,255,.2);stroke-width:1;fill:none}.edge.active{stroke:#fff;stroke-width:1.6;filter:drop-shadow(0 0 3px #fff)}
.edge.in-trace{stroke:rgba(255,255,255,.7);stroke-width:1.3}
.node{cursor:pointer;outline:none}.node .shape{fill:#090a0c;stroke:rgba(255,255,255,.55);stroke-width:1.2}
.node text{fill:#d7d7d7;font:9px Consolas,monospace;text-anchor:middle;letter-spacing:.08em}
.node .subtext{fill:#777;font:8px Consolas,monospace}
.node.active .shape{stroke:#fff;filter:drop-shadow(0 0 6px #fff);animation:pulse 1.2s ease-in-out infinite}
.node.in-trace .shape{stroke:#fff;opacity:1}
.node.selected .shape{stroke:#fff;stroke-width:2}
.node.unknown .shape{stroke-dasharray:3 3;opacity:.7}
.node.error .shape{stroke:var(--red)}
.node .core{fill:#fff;opacity:.75}
@keyframes pulse{50%{filter:drop-shadow(0 0 1px #fff);opacity:.65}}
.topology-note{position:absolute;bottom:10px;left:12px;color:var(--dim);font:9px Consolas,monospace}
.inspector{grid-column:3;grid-row:1;overflow:auto;padding:12px}
.inspector h2{font-size:12px;font-weight:500;margin:0 0 10px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:88px 1fr;gap:5px 8px;margin:9px 0}.kv span:nth-child(odd){color:var(--dim)}
.raw-head{display:flex;align-items:center;gap:7px;margin:14px 0 5px;color:var(--dim);font-size:9px;letter-spacing:.12em}
pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:#0b0c0e;border:1px solid var(--faint);padding:8px;margin:0;max-height:230px;overflow:auto;font-size:10px;line-height:1.5}
.timeline{grid-column:1/4;grid-row:2;padding:10px 12px;overflow:auto}
.timeline-head{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}.timeline-head .panel-title{margin:0}
.replay-controls{display:flex;align-items:center;gap:4px}.replay-controls input[type=range]{width:110px;padding:0}
.artifact-tools{display:flex;gap:5px;margin:6px 0}.artifact-tools input{min-width:0;flex:1}
.artifact-view{max-height:300px;overflow:auto}.dynamic-edge{stroke-dasharray:3 3}
#bars{display:flex;flex-direction:column;gap:4px}
.bar-row{display:grid;grid-template-columns:140px 1fr 54px;gap:8px;align-items:center;min-height:18px}
.bar-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c5c5c5}
.bar-track{height:8px;position:relative;background:var(--faint)}
.bar{position:absolute;top:1px;height:6px;min-width:2px;background:#d8d8d8}
.bar.failed{background:var(--red)}.bar.running{background:#fff;box-shadow:0 0 5px #fff}.bar.waiting{background:var(--gold)}
.bar-duration{text-align:right;color:var(--dim);font:9px Consolas,monospace}
.empty{color:var(--dim);padding:10px 4px}
.memory-tools{display:flex;gap:5px;margin-bottom:8px}.memory-tools input{min-width:0;width:100%}
.detail-content{font-size:12px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.error{color:#ff8585;white-space:pre-wrap}
.badge{font:9px Consolas,monospace;color:var(--dim);border:1px solid var(--line);padding:2px 5px}
.screen{display:none}.screen.active{display:block}
@media(max-width:980px){main{grid-template-columns:190px minmax(300px,1fr);grid-template-rows:minmax(340px,1fr) 190px 250px}aside{grid-column:1;grid-row:1}.center{grid-column:2;grid-row:1}.inspector{grid-column:1/3;grid-row:3}.timeline{grid-column:1/3;grid-row:2}}
@media(max-width:650px){header{gap:9px;padding:0 9px}.sub{display:none}nav button{padding:7px 5px}main{height:auto;min-height:calc(100vh - 48px);grid-template-columns:1fr;grid-template-rows:220px 360px 190px 330px}.center{grid-column:1;grid-row:2}.inspector{grid-column:1;grid-row:4}.timeline{grid-column:1;grid-row:3}aside{grid-column:1;grid-row:1}.bar-row{grid-template-columns:110px 1fr 45px}}
main.memory-view{grid-template-rows:minmax(0,1fr) 0}
@media(max-width:980px){main.memory-view{grid-template-rows:minmax(340px,1fr) 0 250px}}
@media(max-width:650px){main.memory-view{grid-template-rows:220px 360px 0 330px}}
main.memory-view .timeline{display:none}
.memory-canvas{display:none;flex:1;padding:20px;overflow:auto;min-height:0}
.memory-canvas h2{font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--dim)}
.memory-canvas pre{max-height:none;min-height:120px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <span class="brand">思绪</span><span class="sub">运行控制台 / 实时观测</span>
  <span class="status"><i id="connectionLamp" class="lamp"></i><span id="connection">正在连接观测服务</span></span>
  <span class="status" id="guanjiaStatus">管家未接入</span>
  <span class="grow"></span>
  <span class="muted">追踪</span><span id="traceId" class="id">—</span>
  <nav aria-label="控制台视图">
    <button class="selected" data-tab="live">实时</button>
    <button data-tab="traces">历史</button>
    <button data-tab="memory">记忆</button>
    <button data-tab="nodes">系统</button>
  </nav>
</header>
<main>
  <aside>
    <section id="traceScreen" class="screen active">
      <h2 class="panel-title">执行记录</h2>
      <div id="traceList" class="trace-list"></div>
      <div id="tracePaging" class="row" style="justify-content:space-between;margin-top:8px">
        <button id="traceNewer" type="button">更新</button><span id="tracePage" class="muted">最近记录</span><button id="traceOlder" type="button">更早</button>
      </div>
    </section>
    <section id="memoryScreen" class="screen">
      <h2 class="panel-title">记忆浏览 / 只读</h2>
      <form id="memorySearch" class="memory-tools">
        <input id="memoryQuery" type="search" placeholder="搜索记忆内容或标签" aria-label="搜索记忆">
        <button type="submit">搜索</button>
      </form>
      <div class="memory-tools">
        <input id="memoryType" type="text" placeholder="记忆类型" aria-label="按记忆类型筛选">
        <button id="memoryFilter" type="button">筛选</button>
      </div>
      <div id="memoryList" class="memory-list"></div>
      <div class="row" style="justify-content:space-between;margin-top:8px">
        <button id="memoryPrev" type="button">上一页</button><span id="memoryPage" class="muted">—</span><button id="memoryNext" type="button">下一页</button>
      </div>
    </section>
    <section id="nodeScreen" class="screen">
      <h2 class="panel-title">系统节点</h2>
      <div id="nodeList"></div>
      <h2 class="panel-title" style="margin-top:16px">数据保留</h2>
      <div id="retentionSummary" class="muted">正在读取</div>
      <button id="cleanupRetention" type="button" style="margin-top:8px">清理过期记录</button>
    </section>
    <section id="eventScreen">
      <h2 class="panel-title">运行事件</h2>
      <div id="eventList" class="event-list"><span class="empty">等待真实运行事件</span></div>
    </section>
  </aside>
  <section class="center">
    <div class="center-head"><strong id="viewTitle">实时拓扑</strong><span id="viewSub">仅显示实际观测到的执行</span><span class="grow"></span><span id="watermark" class="mono">事件序号 —</span></div>
    <svg id="topology" viewBox="0 0 800 440" role="img" aria-label="运行拓扑">
      <path class="edge" data-edge="gateway-main" data-source="agent-runtime" data-target="main-agent" d="M170 220 H320"/>
      <path class="edge" data-edge="main-memory" data-source="main-agent" data-target="memory-engine" d="M430 205 C500 160 520 132 590 132"/>
      <path class="edge" data-edge="main-model" data-source="main-agent" data-target="model-provider" d="M430 220 H590"/>
      <path class="edge" data-edge="main-tools" data-source="main-agent" data-target="tool-router" d="M430 235 C500 280 520 310 590 310"/>
      <g class="node" data-node="agent-runtime" tabindex="0" role="button" aria-label="智能体运行时">
        <rect class="shape" x="95" y="188" width="75" height="64"/>
        <circle class="core" cx="132.5" cy="216" r="3"/>
        <text x="132.5" y="232">运行时</text><text class="subtext" x="132.5" y="245">本机接口</text>
      </g>
      <g class="node" data-node="main-agent" tabindex="0" role="button" aria-label="主智能体">
        <circle class="shape" cx="375" cy="220" r="52"/><circle class="shape" cx="375" cy="220" r="45"/>
        <circle class="core" cx="375" cy="214" r="3"/>
        <text x="375" y="232">主智能体</text><text class="subtext" x="375" y="246">对话处理</text>
      </g>
      <g class="node unknown" data-node="memory-engine" tabindex="0" role="button" aria-label="记忆引擎">
        <circle class="shape" cx="635" cy="132" r="34"/><circle class="shape" cx="635" cy="132" r="25"/>
        <circle class="core" cx="635" cy="126" r="3"/>
        <text x="635" y="145">记忆引擎</text><text class="subtext" x="635" y="158">本地存储</text>
      </g>
      <g class="node unknown" data-node="model-provider" tabindex="0" role="button" aria-label="模型服务">
        <path class="shape" d="M635 176 L671 212 L635 248 L599 212 Z"/>
        <circle class="core" cx="635" cy="207" r="3"/>
        <text x="635" y="222">模型调用</text><text class="subtext" x="635" y="235">外部服务</text>
      </g>
      <g class="node unknown" data-node="tool-router" tabindex="0" role="button" aria-label="工具路由">
        <path class="shape" d="M608 284 L662 284 L679 310 L662 336 L608 336 L591 310 Z"/>
        <circle class="core" cx="635" cy="305" r="3"/>
        <text x="635" y="319">工具路由</text><text class="subtext" x="635" y="331">能力调用</text>
      </g>
    </svg>
    <div id="memoryCanvas" class="memory-canvas">
      <h2>记忆数据 / 来源：管家主记忆库</h2>
      <div id="memorySummary" class="muted">正在读取记忆索引</div>
      <h2 id="memoryPreviewTitle">选择一条记忆查看内容</h2>
      <pre id="memoryPreview">记忆详情将在此显示</pre>
    </div>
    <span class="topology-note" id="topologyNote">当前没有执行中的追踪</span>
  </section>
  <aside class="inspector">
    <h2 id="inspectorTitle">详情 / 选择一条追踪或节点</h2>
    <div id="inspectorMeta" class="kv"></div>
    <div id="inspectorRaw"></div>
  </aside>
  <section class="timeline">
    <div class="timeline-head">
      <h2 class="panel-title">执行时间轴</h2><span id="timelineTrace" class="muted"></span><span class="grow"></span>
      <div class="replay-controls" aria-label="历史回放">
        <button id="pinTrace" type="button" disabled>固定追踪</button>
        <button id="replayPrevious" type="button" disabled aria-label="上一步">上一步</button>
        <button id="replayToggle" type="button" disabled>播放</button>
        <button id="replayNext" type="button" disabled aria-label="下一步">下一步</button>
        <input id="replaySeek" type="range" min="0" max="0" value="0" aria-label="回放进度">
        <select id="replaySpeed" aria-label="回放速度">
          <option value="0.5">0.5 倍</option><option value="1" selected>1 倍</option><option value="2">2 倍</option>
        </select>
      </div>
      <span class="badge">历史回放仅重现事件</span>
    </div>
    <div id="bars"><span class="empty">选择一条追踪，查看实际执行步骤</span></div>
  </section>
</main>
<script>
(() => {
  const state = {
    snapshot: null,
    traces: [],
    selectedTrace: null,
    selectedSpan: null,
    selectedNode: null,
    events: [],
    eventOffsets: new Set(),
    source: null,
    tab: 'live',
    historyOffset: 0,
    historyLimit: 50,
    replay: { events: [], index: -1, timer: null },
    memory: { items: [], total: 0, offset: 0, limit: 30, selectedId: null },
    activeNodes: new Map(),
  };
  const memorySourceLabel = (source) => ({
    user: '用户提供',
    user_correction: '用户纠正',
    observation: '日常观察',
    task: '任务记录',
    self_loop: '自主整理',
    system: '系统记录',
  })[source] ?? source ?? '未知';
  const memoryRetentionLabel = (retention) => ({
    permanent: '永久',
    long_term: '长期',
    adaptive: '动态调整',
    temporary: '临时',
  })[retention] ?? retention ?? '未知';
  const statusLabel = (status) => ({
    running: '运行中',
    waiting: '等待审批',
    completed: '已完成',
    failed: '失败',
    online: '在线',
    offline: '离线',
    unknown: '未知',
    idle: '空闲',
    active: '有效',
    archived: '已归档',
    superseded: '已替代',
    retracted: '已撤回',
  })[status] ?? status ?? '未知';
  const nodeLabel = (id) => ({
    'voice-runtime': '语音运行时',
    'audio-capture': '音频采集',
    vad: '语音活动检测',
    asr: '语音识别',
    'speaker-recognition': '说话人识别',
    'agent-runtime': '智能体运行时',
    'main-agent': '主智能体',
    'worker-runtime': '工作节点',
    'memory-engine': '记忆引擎',
    'model-provider': '模型服务',
    'tool-router': '工具路由',
    tts: '语音合成',
    'audio-playback': '音频播放',
  })[id] ?? '其他节点';
  const nodeTypeLabel = (type) => ({
    processor: '处理模块',
    agent: '智能体',
    memory: '记忆',
    model: '模型',
    tool: '工具',
  })[type] ?? type;
  const spanLabel = (name) => ({
    'CHAT COMPLETION': '对话请求',
    'MAIN AGENT TURN': '主智能体处理',
    'MODEL INVOCATION': '模型调用',
    'WRITE RAW CONVERSATION': '写入原始对话',
    'RECALL MEMORIES': '检索记忆',
  })[name] ?? (name.startsWith('TOOL ') ? `调用工具：${name.slice(5)}` : name);
  const eventLabel = (type) => ({
    'trace.started': '追踪开始',
    'trace.completed': '追踪完成',
    'trace.failed': '追踪失败',
    'span.started': '步骤开始',
    'span.completed': '步骤完成',
    'span.failed': '步骤失败',
    'span.waiting': '等待审批',
    'node.registered': '节点注册',
    'node.heartbeat': '节点心跳',
    'node.health_changed': '节点状态变化',
    'artifact.created': '原始数据已保存',
  })[type] ?? type;
  const byId = (id) => document.getElementById(id);
  const make = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const request = async (url) => {
    const response = await fetch(url, { credentials: 'same-origin', headers: { accept: 'application/json' } });
    if (!response.ok) {
      const body = await response.text();
      throw new Error(`HTTP ${response.status}: ${body}`);
    }
    return response.json();
  };
  const send = async (url, method, body) => {
    const response = await fetch(url, {
      method,
      credentials: 'same-origin',
      headers: { accept: 'application/json', 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    return response.json();
  };
  const pretty = (value) => value === null || value === undefined
    ? '无数据'
    : typeof value === 'string' ? value : JSON.stringify(value, null, 2);
  const time = (value) => value ? new Date(value).toLocaleTimeString() : '—';
  const duration = (value) => value === null || value === undefined ? '—' : `${value} 毫秒`;
  const showError = (error) => {
    byId('connection').textContent = '连接异常';
    byId('connectionLamp').classList.remove('on');
    byId('inspectorTitle').textContent = '观测服务异常';
    const message = error instanceof Error ? error.message : String(error);
    byId('inspectorRaw').replaceChildren(make('pre', 'error', message.includes('memory_engine_not_configured')
      ? '记忆引擎尚未启用，无法浏览记忆。'
      : message));
  };

  function setTab(tab) {
    state.tab = tab;
    document.querySelectorAll('nav button').forEach((button) => {
      button.classList.toggle('selected', button.dataset.tab === tab);
    });
    byId('traceScreen').classList.toggle('active', tab === 'live' || tab === 'traces');
    byId('memoryScreen').classList.toggle('active', tab === 'memory');
    byId('nodeScreen').classList.toggle('active', tab === 'nodes');
    byId('tracePaging').style.display = tab === 'traces' ? '' : 'none';
    byId('eventScreen').style.display = tab === 'live' ? '' : 'none';
    byId('memoryCanvas').style.display = tab === 'memory' ? 'block' : 'none';
    document.querySelector('main').classList.toggle('memory-view', tab === 'memory');
    byId('viewTitle').textContent = ({ live: '实时拓扑', traces: '执行追踪', memory: '记忆浏览', nodes: '系统状态' })[tab];
    byId('viewSub').textContent = tab === 'memory' ? '只读 / 数据来自管家主记忆库' : '仅显示实际运行状态';
    byId('topology').style.display = tab === 'memory' ? 'none' : '';
    byId('topologyNote').style.display = tab === 'memory' ? 'none' : '';
    if (tab === 'memory') loadMemories();
    if (tab === 'nodes') { renderNodes(); loadRetention(); }
    if (tab === 'traces') loadHistory();
  }

  function renderTraceList() {
    const list = byId('traceList');
    list.replaceChildren();
    for (const trace of state.traces) {
      const button = make('button', `entry${trace.traceId === state.selectedTrace?.traceId ? ' selected' : ''}`);
      button.type = 'button';
      button.append(make('strong', '', String(trace.input?.userText ?? trace.traceId)));
      button.append(make('small', '', `${time(trace.startedAt)} · ${statusLabel(trace.status)} · ${duration(trace.durationMs)}`));
      button.addEventListener('click', () => selectTrace(trace.traceId));
      list.append(button);
    }
    if (state.traces.length === 0) list.append(make('span', 'empty', '还没有实际执行记录'));
    const first = state.traces.length ? state.historyOffset + 1 : 0;
    byId('tracePage').textContent = state.tab === 'traces'
      ? `第 ${first}–${state.historyOffset + state.traces.length} 条`
      : '最近记录';
    byId('traceNewer').disabled = state.historyOffset === 0;
    byId('traceOlder').disabled = state.traces.length < state.historyLimit;
  }

  async function loadHistory() {
    try {
      const page = await request(`/api/observability/traces?limit=${state.historyLimit}&offset=${state.historyOffset}`);
      state.traces = page.traces;
      renderTraceList();
    } catch (error) { showError(error); }
  }

  function renderNodes() {
    if (!state.snapshot) return;
    const list = byId('nodeList');
    list.replaceChildren();
    for (const node of state.snapshot.nodes) {
      const button = make('button', `entry${state.selectedNode === node.id ? ' selected' : ''}`);
      button.type = 'button';
      button.append(make('strong', '', nodeLabel(node.id)));
      const instances = node.instances.length ? ` · 实例 ${node.instances.length}` : '';
      button.append(make('small', '', `${nodeTypeLabel(node.type)} · 健康：${statusLabel(node.health)} · 执行：${statusLabel(node.execution)}${instances} · ${node.observed ? '已有记录' : '暂无步骤记录'}`));
      button.addEventListener('click', () => selectNode(node.id));
      list.append(button);
    }
  }

  async function loadRetention() {
    try {
      const stats = await request('/api/observability/retention');
      byId('retentionSummary').textContent =
        `追踪 ${stats.traceCount} 条 · 事件 ${stats.eventCount} 条 · 原始数据 ${stats.artifactCount} 份 / ${stats.artifactBytes} 字节`;
    } catch (error) { showError(error); }
  }

  function renderDynamicTopology() {
    if (!state.snapshot) return;
    const svg = byId('topology');
    svg.querySelectorAll('.dynamic-node,.dynamic-edge').forEach((item) => item.remove());
    const positions = new Map([
      ['agent-runtime', [132, 220]], ['main-agent', [375, 220]],
      ['memory-engine', [635, 132]], ['model-provider', [635, 212]],
      ['tool-router', [635, 310]],
    ]);
    const zoneX = { INPUT: 55, RUNTIME: 350, MEMORY: 750, PROVIDERS: 750, OUTPUT: 750 };
    const zoneCounts = new Map();
    for (const node of state.snapshot.nodes) {
      const existing = svg.querySelector(`[data-node="${CSS.escape(node.id)}"]`);
      if (existing) {
        existing.classList.toggle('unknown', !node.observed);
        existing.classList.toggle('error', node.health === 'offline' || node.execution === 'error');
        continue;
      }
      const count = zoneCounts.get(node.zone) ?? 0;
      zoneCounts.set(node.zone, count + 1);
      const x = zoneX[node.zone] ?? 730;
      const y = 62 + (count % 7) * 47;
      positions.set(node.id, [x, y]);
      const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      group.setAttribute('class', `node dynamic-node${node.observed ? '' : ' unknown'}${node.health === 'offline' ? ' error' : ''}`);
      group.dataset.node = node.id;
      group.setAttribute('tabindex', '0');
      group.setAttribute('role', 'button');
      group.setAttribute('aria-label', nodeLabel(node.id));
      const shape = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      shape.setAttribute('class', 'shape');
      shape.setAttribute('x', String(x - 31));
      shape.setAttribute('y', String(y - 16));
      shape.setAttribute('width', '62');
      shape.setAttribute('height', '32');
      const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      title.setAttribute('x', String(x));
      title.setAttribute('y', String(y + 3));
      title.textContent = nodeLabel(node.id);
      group.append(shape, title);
      group.addEventListener('click', () => selectNode(node.id));
      group.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectNode(node.id); }
      });
      svg.append(group);
    }
    const connections = state.snapshot.connections ?? [];
    for (const connection of connections) {
      const edgeId = `${connection.source}-${connection.target}`;
      if (svg.querySelector(`[data-edge="${CSS.escape(edgeId)}"]`)) continue;
      if (!positions.has(connection.source) || !positions.has(connection.target)) continue;
      const [x1, y1] = positions.get(connection.source);
      const [x2, y2] = positions.get(connection.target);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'edge dynamic-edge');
      path.dataset.edge = edgeId;
      path.dataset.source = connection.source;
      path.dataset.target = connection.target;
      path.setAttribute('d', `M${x1} ${y1} L${x2} ${y2}`);
      svg.insertBefore(path, svg.firstChild);
    }
    renderTracePath();
    renderTopologyActivity();
  }

  function renderEvent(event) {
    if (state.eventOffsets.has(event.hubOffset)) return;
    state.eventOffsets.add(event.hubOffset);
    const list = byId('eventList');
    if (list.firstElementChild?.classList.contains('empty')) list.replaceChildren();
    const row = make('div', `event${event.eventType.endsWith('.failed') ? ' failed' : ''}`);
    row.textContent = `${time(event.timestamp)}  ${eventLabel(event.eventType)}  ${nodeLabel(event.nodeId)}`;
    list.prepend(row);
    while (list.children.length > 35) list.lastElementChild.remove();
    state.events.unshift(event);
    if (state.events.length > 200) state.events.pop();
  }

  function renderTopologyActivity() {
    document.querySelectorAll('.edge').forEach((edge) => {
      const source = edge.dataset.source;
      const target = edge.dataset.target;
      edge.classList.toggle('active', Boolean(
        (source && state.activeNodes.get(source)) || (target && state.activeNodes.get(target)),
      ));
    });
  }

  function updateNodeActivity(event) {
    if (!event.nodeId) return;
    const count = state.activeNodes.get(event.nodeId) ?? 0;
    if (event.eventType === 'span.started') state.activeNodes.set(event.nodeId, count + 1);
    if (event.eventType === 'span.completed' || event.eventType === 'span.failed' || event.eventType === 'span.waiting') {
      if (count <= 1) state.activeNodes.delete(event.nodeId);
      else state.activeNodes.set(event.nodeId, count - 1);
    }
    const active = [...state.activeNodes.keys()];
    byId('topologyNote').textContent = active.length
      ? `执行中：${active.map(nodeLabel).join(' / ')}`
      : '当前没有执行中的追踪';
    renderTracePath();
    renderTopologyActivity();
  }

  function renderTracePath() {
    const touched = new Set(state.selectedTrace?.spans.map((span) => span.nodeId) ?? []);
    document.querySelectorAll('.node').forEach((node) => {
      const id = node.dataset.node;
      node.classList.toggle('active', Boolean(id && state.activeNodes.get(id)));
      node.classList.toggle('in-trace', Boolean(id && touched.has(id)));
    });
    document.querySelectorAll('.edge').forEach((edge) => {
      edge.classList.toggle('in-trace', Boolean(touched.has(edge.dataset.source) || touched.has(edge.dataset.target)));
    });
  }

  function renderGuanjiaStatus(nodes) {
    const voice = nodes.find((node) => node.id === 'voice-runtime');
    const instances = voice?.instances ?? [];
    const status = instances.some((instance) => instance.health === 'online') ? '管家在线'
      : instances.length > 0 ? '管家已离线' : '管家未接入';
    byId('guanjiaStatus').textContent = status;
  }

  function renderInspector(title, values, rawSections = []) {
    byId('inspectorTitle').textContent = title;
    const meta = byId('inspectorMeta');
    meta.replaceChildren();
    for (const [key, value] of values) {
      meta.append(make('span', '', key), make('span', 'mono', value ?? '—'));
    }
    const raw = byId('inspectorRaw');
    raw.replaceChildren();
    for (const [label, value] of rawSections) {
      const head = make('div', 'raw-head', label);
      const copy = make('button', '', '复制');
      copy.type = 'button';
      const text = pretty(value);
      copy.addEventListener('click', () => navigator.clipboard.writeText(text).catch(showError));
      head.append(copy);
      raw.append(head, make('pre', '', text));
    }
  }

  async function selectNode(nodeId) {
    state.selectedNode = nodeId;
    state.selectedSpan = null;
    document.querySelectorAll('.node').forEach((node) => node.classList.toggle('selected', node.dataset.node === nodeId));
    const node = state.snapshot?.nodes.find((item) => item.id === nodeId);
    let detail = node;
    try { detail = await request(`/api/observability/nodes/${encodeURIComponent(nodeId)}`); }
    catch (error) { showError(error); }
    if (state.selectedNode !== nodeId) return;
    const spans = state.selectedTrace?.spans.filter((span) => span.nodeId === nodeId) ?? [];
    renderInspector(nodeLabel(nodeId), [
      ['节点标识', nodeId],
      ['节点类型', detail ? nodeTypeLabel(detail.type) : undefined],
      ['健康状态', detail ? statusLabel(detail.health) : undefined],
      ['执行状态', detail ? statusLabel(detail.execution) : undefined],
      ['已观测', detail?.observed ? '是' : '暂无步骤记录'],
      ['运行实例', String(detail?.instances?.length ?? 0)],
      ['追踪步骤数', String(spans.length)],
    ], [
      ['实例列表', detail?.instances],
      ['最近执行步骤', detail?.recentSpans],
      ...spans.map((span) => [spanLabel(span.name), { status: statusLabel(span.status), durationMs: span.durationMs, input: span.input, output: span.output }]),
    ]);
  }

  function selectSpan(span) {
    state.selectedSpan = span.spanId;
    state.selectedNode = span.nodeId;
    document.querySelectorAll('.node').forEach((node) => node.classList.toggle('selected', node.dataset.node === span.nodeId));
    const trace = state.selectedTrace;
    renderTracePath();
    renderInspector(spanLabel(span.name), [
      ['追踪 ID', span.traceId],
      ['步骤 ID', span.spanId],
      ['父步骤 ID', span.parentSpanId],
      ['执行节点', nodeLabel(span.nodeId)],
      ['执行状态', statusLabel(span.status)],
      ['开始时间', time(span.startedAt)],
      ['结束时间', time(span.endedAt)],
      ['耗时', duration(span.durationMs)],
    ], [['完整输入', span.input], ['完整输出', span.output], ['错误信息', span.error]]);
    renderArtifacts(span);
    if (trace) byId('traceId').textContent = trace.traceId;
  }

  async function selectTrace(traceId) {
    try {
      const changed = state.selectedTrace?.traceId !== traceId;
      state.selectedTrace = await request(`/api/observability/traces/${encodeURIComponent(traceId)}`);
      state.selectedNode = null;
      state.selectedSpan = null;
      if (changed) {
        stopReplay();
        await loadReplay(traceId);
      }
      renderTracePath();
      renderTraceList();
      renderTimeline();
      renderReplayControls();
      const trace = state.selectedTrace;
      byId('traceId').textContent = trace.traceId;
      renderInspector('追踪 / ' + statusLabel(trace.status), [
        ['追踪 ID', trace.traceId],
        ['会话', trace.sessionId],
        ['开始时间', time(trace.startedAt)],
        ['结束时间', time(trace.endedAt)],
        ['总耗时', duration(trace.durationMs)],
        ['步骤数', String(trace.spans.length)],
        ['保留状态', trace.pinned ? '已固定' : '自动清理'],
      ], [['完整输入', trace.input], ['完整输出', trace.output], ['错误信息', trace.error]]);
    } catch (error) { showError(error); }
  }

  async function loadReplay(traceId) {
    const events = [];
    let after = 0;
    let hasMore = true;
    while (hasMore) {
      const page = await request(`/api/observability/traces/${encodeURIComponent(traceId)}/replay?after=${after}&limit=1000`);
      events.push(...page.events);
      hasMore = page.hasMore;
      if (page.events.length) after = page.events[page.events.length - 1].hubOffset;
      else hasMore = false;
    }
    state.replay.events = events;
    state.replay.index = events.length ? 0 : -1;
    byId('replaySeek').max = String(Math.max(0, events.length - 1));
    byId('replaySeek').value = String(Math.max(0, state.replay.index));
  }

  function stopReplay() {
    if (state.replay.timer !== null) clearInterval(state.replay.timer);
    state.replay.timer = null;
    byId('replayToggle').textContent = '播放';
  }

  function renderReplayControls() {
    const hasEvents = state.replay.events.length > 0;
    const index = state.replay.index;
    byId('pinTrace').disabled = !state.selectedTrace;
    byId('pinTrace').textContent = state.selectedTrace?.pinned ? '取消固定' : '固定追踪';
    byId('replayPrevious').disabled = !hasEvents || index <= 0;
    byId('replayNext').disabled = !hasEvents || index >= state.replay.events.length - 1;
    byId('replayToggle').disabled = !hasEvents;
    byId('replaySeek').disabled = !hasEvents;
    byId('replaySeek').max = String(Math.max(0, state.replay.events.length - 1));
    byId('replaySeek').value = String(Math.max(0, index));
  }

  function renderReplayFrame() {
    const events = state.replay.events.slice(0, state.replay.index + 1);
    state.activeNodes.clear();
    for (const event of events) {
      const count = state.activeNodes.get(event.nodeId) ?? 0;
      if (event.eventType === 'span.started') state.activeNodes.set(event.nodeId, count + 1);
      if (['span.completed', 'span.failed', 'span.waiting'].includes(event.eventType)) {
        if (count <= 1) state.activeNodes.delete(event.nodeId);
        else state.activeNodes.set(event.nodeId, count - 1);
      }
    }
    const event = state.replay.events[state.replay.index];
    if (event) {
      byId('topologyNote').textContent = `回放 ${state.replay.index + 1}/${state.replay.events.length} · ${time(event.timestamp)} · ${eventLabel(event.eventType)}`;
      const span = state.selectedTrace?.spans.find((item) => item.spanId === event.spanId);
      if (span) selectSpan(span);
      else renderInspector('回放事件 / ' + eventLabel(event.eventType), [
        ['事件类型', eventLabel(event.eventType)],
        ['发生时间', time(event.timestamp)],
        ['节点', nodeLabel(event.nodeId)],
        ['事件序号', String(event.hubOffset)],
      ], [['完整事件', event]]);
    }
    renderTracePath();
    renderTopologyActivity();
    renderReplayControls();
  }

  function stepReplay(delta) {
    if (!state.replay.events.length) return;
    state.replay.index = Math.max(0, Math.min(state.replay.events.length - 1, state.replay.index + delta));
    renderReplayFrame();
  }

  function playReplay() {
    if (state.replay.timer !== null) {
      stopReplay();
      return;
    }
    if (state.replay.index >= state.replay.events.length - 1) state.replay.index = 0;
    const speed = Number(byId('replaySpeed').value);
    byId('replayToggle').textContent = '暂停';
    state.replay.timer = setInterval(() => {
      if (state.replay.index >= state.replay.events.length - 1) {
        stopReplay();
        return;
      }
      stepReplay(1);
    }, 500 / speed);
    renderReplayFrame();
  }

  function renderArtifacts(span) {
    const refs = span.artifacts ?? [];
    if (!refs.length) return;
    const raw = byId('inspectorRaw');
    const section = make('section', 'artifact-section');
    section.append(make('div', 'raw-head', '原始数据 / Artifact'));
    for (const artifact of refs) {
      const header = make('div', 'raw-head', `${artifact.type} · ${artifact.byteLength} 字节 · ${artifact.completeness === 'complete' ? '完整' : '部分'}`);
      const load = make('button', '', '加载');
      const exportButton = make('button', '', '导出');
      const copy = make('button', '', '复制');
      load.type = exportButton.type = copy.type = 'button';
      const tools = make('div', 'artifact-tools');
      const search = document.createElement('input');
      search.type = 'search';
      search.placeholder = '在原始数据中查找';
      search.setAttribute('aria-label', '查找原始数据');
      const result = make('span', 'muted', '');
      const output = make('pre', 'artifact-view', '尚未加载');
      const content = { text: '', chunks: [] };
      const readArtifact = async () => {
        if (content.chunks.length) return;
        const parts = [];
        let offset = 0;
        const decoder = new TextDecoder();
        let text = '';
        while (true) {
          const part = await request(`/api/observability/artifacts/${encodeURIComponent(artifact.artifactId)}?offset=${offset}&limit=524288`);
          const bytes = Uint8Array.from(atob(part.content), (char) => char.charCodeAt(0));
          parts.push(bytes);
          text += decoder.decode(bytes, { stream: part.nextOffset !== null });
          if (part.nextOffset === null) break;
          offset = part.nextOffset;
        }
        content.text = text;
        content.chunks = parts;
        output.textContent = text;
      };
      load.addEventListener('click', () => readArtifact().catch(showError));
      copy.addEventListener('click', () => readArtifact()
        .then(() => navigator.clipboard.writeText(content.text)).catch(showError));
      exportButton.addEventListener('click', () => readArtifact().then(() => {
        const blob = new Blob(content.chunks, { type: artifact.contentType });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${artifact.artifactId}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }).catch(showError));
      search.addEventListener('input', () => {
        if (!content.text) return;
        const query = search.value;
        const matches = query ? content.text.split(query).length - 1 : 0;
        const position = query ? content.text.indexOf(query) : -1;
        result.textContent = query ? `${matches} 处 · 首次位置 ${position}` : '';
      });
      header.append(load, copy, exportButton);
      tools.append(search, result);
      section.append(header, tools, output);
    }
    raw.append(section);
  }

  function renderTimeline() {
    const target = byId('bars');
    target.replaceChildren();
    const trace = state.selectedTrace;
    byId('timelineTrace').textContent = trace ? `${trace.traceId} / ${statusLabel(trace.status)}` : '';
    if (!trace || trace.spans.length === 0) {
      target.append(make('span', 'empty', '这条追踪没有步骤记录'));
      return;
    }
    const start = Date.parse(trace.startedAt);
    const total = Math.max(1, trace.durationMs ?? (Date.now() - start));
    for (const span of trace.spans) {
      const row = make('button', 'bar-row');
      row.type = 'button';
      row.style.cssText = 'background:transparent;border:0;padding:0;text-align:left';
      row.append(make('span', 'bar-name', spanLabel(span.name)));
      const track = make('span', 'bar-track');
      const bar = make('span', `bar ${span.status}`);
      const left = Math.max(0, Math.min(99, ((Date.parse(span.startedAt) - start) / total) * 100));
      const width = Math.max(1, Math.min(100 - left, ((span.durationMs ?? (Date.now() - Date.parse(span.startedAt))) / total) * 100));
      bar.style.left = `${left}%`;
      bar.style.width = `${width}%`;
      track.append(bar);
      row.append(track, make('span', 'bar-duration', duration(span.durationMs)));
      row.addEventListener('click', () => selectSpan(span));
      target.append(row);
    }
  }

  async function loadSnapshot() {
    state.snapshot = await request('/api/observability/snapshot');
    renderGuanjiaStatus(state.snapshot.nodes ?? []);
    if (state.tab !== 'traces') state.traces = state.snapshot.recentTraces;
    byId('watermark').textContent = `事件序号 ${state.snapshot.watermark}`;
    for (const event of state.snapshot.recentEvents) renderEvent(event);
    if (state.tab === 'traces') await loadHistory();
    else renderTraceList();
    renderNodes();
    renderDynamicTopology();
    if (state.selectedTrace && state.traces.some((trace) => trace.traceId === state.selectedTrace.traceId)) {
      await selectTrace(state.selectedTrace.traceId);
    } else if (state.traces.length > 0) {
      await selectTrace(state.traces[0].traceId);
    }
  }

  function connectEvents(watermark) {
    state.source?.close();
    const source = new EventSource(`/api/observability/events?after=${encodeURIComponent(watermark)}`);
    state.source = source;
    source.onopen = () => {
      byId('connection').textContent = '观测通道已连接';
      byId('connectionLamp').classList.add('on');
    };
    source.onerror = () => {
      byId('connection').textContent = '观测通道重连中';
      byId('connectionLamp').classList.remove('on');
    };
    const handleRuntimeEvent = (message) => {
      const event = JSON.parse(message.data);
      byId('watermark').textContent = `事件序号 ${event.hubOffset}`;
      renderEvent(event);
      updateNodeActivity(event);
      if (event.traceId === state.selectedTrace?.traceId
        && !state.replay.events.some((item) => item.hubOffset === event.hubOffset)) {
        state.replay.events.push(event);
        state.replay.events.sort((left, right) => left.hubOffset - right.hubOffset);
        renderReplayControls();
      }
      if (event.eventType === 'trace.completed' || event.eventType === 'trace.failed') {
        loadSnapshot().catch(showError);
      } else if (state.selectedTrace?.traceId === event.traceId) {
        selectTrace(event.traceId);
      } else if (event.eventType === 'trace.started') {
        loadSnapshot().catch(showError);
      }
      if (event.eventType.startsWith('node.')) loadSnapshot().catch(showError);
    };
    for (const type of [
      'trace.started', 'trace.completed', 'trace.failed',
      'span.started', 'span.completed', 'span.failed', 'span.waiting',
      'node.registered', 'node.heartbeat', 'node.health_changed',
      'artifact.created',
    ]) source.addEventListener(type, handleRuntimeEvent);
    source.addEventListener('resync_required', () => {
      source.close();
      loadSnapshot().then(() => connectEvents(state.snapshot.watermark)).catch(showError);
    });
  }

  async function loadMemories() {
    const params = new URLSearchParams({
      limit: String(state.memory.limit),
      offset: String(state.memory.offset),
    });
    const query = byId('memoryQuery').value.trim();
    const type = byId('memoryType').value.trim();
    if (query) params.set('q', query);
    if (type) params.set('type', type);
    try {
      const page = await request(`/api/observability/memories?${params}`);
      state.memory.items = page.items;
      state.memory.total = page.total;
      renderMemories();
      byId('memorySummary').textContent = `共 ${page.total} 条记忆 · 当前显示 ${page.items.length} 条 · 每页 ${page.limit} 条`;
    } catch (error) { showError(error); }
  }

  function renderMemories() {
    const list = byId('memoryList');
    list.replaceChildren();
    for (const memory of state.memory.items) {
      const button = make('button', `entry${memory.id === state.memory.selectedId ? ' selected' : ''}`);
      button.type = 'button';
      button.append(make('strong', '', memory.briefContent));
      button.append(make('small', '', `${memory.memoryType} · ${memorySourceLabel(memory.source)} · 重要度 ${memory.importance}`));
      button.addEventListener('click', () => selectMemory(memory.id));
      list.append(button);
    }
    if (state.memory.items.length === 0) list.append(make('span', 'empty', '没有找到匹配的记忆'));
    const first = state.memory.total === 0 ? 0 : state.memory.offset + 1;
    const last = Math.min(state.memory.offset + state.memory.limit, state.memory.total);
    byId('memoryPage').textContent = `第 ${first}–${last} 条 / 共 ${state.memory.total} 条`;
    byId('memoryPrev').disabled = state.memory.offset === 0;
    byId('memoryNext').disabled = state.memory.offset + state.memory.limit >= state.memory.total;
  }

  async function selectMemory(memoryId) {
    try {
      state.memory.selectedId = memoryId;
      renderMemories();
      const memory = await request(`/api/observability/memories/${encodeURIComponent(memoryId)}`);
      byId('memoryPreviewTitle').textContent = memory.briefContent;
      byId('memoryPreview').textContent = memory.content;
      renderInspector('记忆 / ' + memory.memoryType, [
        ['记忆 ID', memory.id],
        ['类型', memory.memoryType],
        ['来源', memorySourceLabel(memory.source)],
        ['保留策略', memoryRetentionLabel(memory.retention)],
        ['置信度', String(memory.confidence)],
        ['重要度', String(memory.importance)],
        ['创建时间', time(memory.createdAt)],
        ['更新时间', time(memory.updatedAt)],
        ['最近使用', time(memory.lastUsedAt)],
        ['使用次数', String(memory.useCount)],
      ], [['完整内容', memory.content], ['涉及人员', memory.people],
        ['证据来源', memory.evidence], ['关联媒体', memory.media]]);
    } catch (error) { showError(error); }
  }

  document.querySelectorAll('nav button').forEach((button) => button.addEventListener('click', () => setTab(button.dataset.tab)));
  document.querySelectorAll('.node').forEach((node) => {
    const activate = () => selectNode(node.dataset.node);
    node.addEventListener('click', activate);
    node.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(); }
    });
  });
  byId('memorySearch').addEventListener('submit', (event) => {
    event.preventDefault();
    state.memory.offset = 0;
    loadMemories();
  });
  byId('memoryFilter').addEventListener('click', () => { state.memory.offset = 0; loadMemories(); });
  byId('memoryPrev').addEventListener('click', () => { state.memory.offset = Math.max(0, state.memory.offset - state.memory.limit); loadMemories(); });
  byId('memoryNext').addEventListener('click', () => { state.memory.offset += state.memory.limit; loadMemories(); });
  byId('traceNewer').addEventListener('click', () => {
    state.historyOffset = Math.max(0, state.historyOffset - state.historyLimit);
    loadHistory();
  });
  byId('traceOlder').addEventListener('click', () => {
    state.historyOffset += state.historyLimit;
    loadHistory();
  });
  byId('replayPrevious').addEventListener('click', () => stepReplay(-1));
  byId('replayNext').addEventListener('click', () => stepReplay(1));
  byId('replayToggle').addEventListener('click', playReplay);
  byId('replaySeek').addEventListener('input', () => {
    stopReplay();
    state.replay.index = Number(byId('replaySeek').value);
    renderReplayFrame();
  });
  byId('replaySpeed').addEventListener('change', () => {
    if (state.replay.timer !== null) {
      stopReplay();
      playReplay();
    }
  });
  byId('pinTrace').addEventListener('click', async () => {
    const trace = state.selectedTrace;
    if (!trace) return;
    try {
      await send(`/api/observability/traces/${encodeURIComponent(trace.traceId)}/pin`, 'POST', {
        pinned: !trace.pinned,
      });
      byId('cleanupRetention').addEventListener('click', async () => {
        if (!window.confirm('清理超过 30 天且未固定的追踪、事件与原始数据？')) return;
        try {
          const result = await send('/api/observability/retention/cleanup', 'POST');
          byId('retentionSummary').textContent =
            `已清理追踪 ${result.stats.traces} 条、事件 ${result.stats.events} 条、原始数据 ${result.stats.artifacts} 份`;
          await loadRetention();
        } catch (error) { showError(error); }
      });
      await selectTrace(trace.traceId);
    } catch (error) { showError(error); }
  });

  loadSnapshot().then(() => connectEvents(state.snapshot.watermark)).catch(showError);
})();
</script>
</body>
</html>
